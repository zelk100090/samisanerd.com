<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam's Blog</title>
    <link rel="stylesheet" href="/blog/style.css">
    <link rel="stylesheet" href="/background.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <!--# set var="pageTitle" value="Blog" -->
    <!--# include virtual="/header.html" -->

    <main class="h-feed">
        <data value="Sam's Blog" class="p-name"></data>
        <div class="h-entry">
            <a class="panel post button u-url desktop" href="https://samisanerd.com/blog/posts/testPost">
                <h2 class="postTitle fredoka p-name">Test Post</h2>
                <div class="fredoka postInfo">
                    <time datetime="2026-10-11" class="dt-published">10/11/26</time>
                    <p class="p-category">Test</p>
                </div>
            </a>
            <a class="panel postMobile button mobile" href="https://samisanerd.com/blog/posts/testPost">
                <h2 class="postTitleMobile fredoka">Test Post</h2>
                <div class="fredoka postInfoMobile">
                    <p><time datetime="2026-10-11">10/11/26</time> - Test</p>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
