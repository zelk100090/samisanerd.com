<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerd For Hire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/background.css">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/header.css">
    <script src="form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <!--# set var="Nerd For Hire Help Form" value="Blog" -->
    <!--# include virtual="/header.html" -->

    <div class="desktop">
<div class="panel navBar">
    <a href="/"><img src="/logo.png" class="logo"></a>
    <span class="pageTitle fredoka"><!--# echo var="pageTitle" default="Page Title" --></span>
</div>
</div>
<div class="mobile">
<div class="panel navBarMobile">
    <a href="/"><img src="/logo.png" class="logoMobile"></a>
    <span class="pageTitleMobile fredoka"><!--# echo var="pageTitle" default="Page Title" --></span>
</div>
</div>

    <form action="/contact" method="POST" id="form">
        <div class="panel formPanel">
            <label for="name" class="fredoka formText">Your Name:</label><br>
            <input type="text" id="name" name="name" class="formInput small fredoka" autocomplete="name" placeholder="First & Last" required>
        </div>
        <div class="panel formPanel">
            <label for="contact" class="fredoka formText">Contact Info:</label><br>
            <input type="text" id="contact" name="contact" class="formInput medium fredoka" autocomplete="email" placeholder="Email or Phone Number" required>
        </div>
        <div class="panel formPanel">
            <label for="address" class="fredoka formText">Town:</label><br>
            <input type="text" id="address" name="address" class="formInput medium fredoka" autocomplete="street-address" placeholder="To ensure you're not too far away " required>
        </div>
        <div class="panel formPanel message">
            <label for="description" class="fredoka formText">What can I help you with?</label><br>
            <br>
            <textarea aria-describedby="descriptionHint" style="width: 80vw; height: 20vh;" type="text" id="description" name="description" class="formInputBig fredoka" required></textarea>
        </div>
        <div class="panel formPanel">
            <label for="file" class="fredoka formText">Images or Other Files (Optional):</label><br>
            <p class="fredoka hint" id="descriptionHint">Include pictures or other relavent files here if you're looking for help solving an issue.<br></p>
            <input type="file" id="file" name="file" class="fileUpload fredoka">
        </div>

        <div class="panel formPanel company">
            <label for="company" class="fredoka formText">Company:</label><br>
            <input type="text" name="company" class="formInput fredoka" autocomplete="off">
        </div>

        <button type="submit" id="submit" class="button panel fredoka buttonText"><span id="message" class="">Submit</span></button>
        
    </form> 
</body>
</htmla
