<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drift Lists">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Drift Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Zen-style floating sidebar of "tabs" (lists) beside one rounded panel, over a gradient tinted by the active list's color. */
@property --accent { syntax: '<color>'; inherits: true; initial-value: #8b7cf6; }
:root {
  --base: #e8e5ee;
  --panel: #fdfcff;
  --soft: #f2f0f7;
  --fg: #1d1b23;
  --muted: #6d6979;
  --line: #e4e1eb;
  --side-fg: #2b2833;
  --hover: rgb(255 255 255 / .42);
  --active: rgb(255 255 255 / .78);
  --scrim: rgb(20 16 30 / .28);
  --ok: #2f9e6a;
  --warn: #c98a12;
  --on-accent: #ffffff;
  --accent: #8b7cf6;
  --shadow: 0 1px 2px rgb(30 20 50 / .06), 0 10px 32px rgb(30 20 50 / .10);
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --base: #121116; --panel: #1c1b21; --soft: #25242b; --fg: #ecebf1; --muted: #9b97a7;
    --line: #2d2b34; --side-fg: #dddbe4; --hover: rgb(255 255 255 / .06); --active: rgb(255 255 255 / .12);
    --scrim: rgb(0 0 0 / .5); --ok: #4cc48c; --warn: #e3ac3e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 36px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --base: #121116; --panel: #1c1b21; --soft: #25242b; --fg: #ecebf1; --muted: #9b97a7;
  --line: #2d2b34; --side-fg: #dddbe4; --hover: rgb(255 255 255 / .06); --active: rgb(255 255 255 / .12);
  --scrim: rgb(0 0 0 / .5); --ok: #4cc48c; --warn: #e3ac3e;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 36px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--base); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 500 11px/1 var(--mono); color: var(--muted); padding: 3px 5px; border-radius: 5px; background: var(--hover); white-space: nowrap; }
svg { display: block; flex: none; }

.app {
  height: 100%; position: relative; overflow: hidden;
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 8px;
  padding-block: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(110% 80% at 0% 0%, color-mix(in oklab, var(--accent) 48%, transparent), transparent 62%),
    radial-gradient(90% 70% at 100% 100%, color-mix(in oklab, var(--accent) 30%, transparent), transparent 66%),
    var(--base);
  transition: --accent .6s ease;
}

/* Sidebar */
.sidebar { display: flex; flex-direction: column; gap: 10px; min-height: 0; color: var(--side-fg); padding: 4px 2px; }
.cmd { display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; padding: 0 10px; border-radius: 10px; background: var(--hover); color: var(--muted); text-align: left; transition: background .15s; }
.cmd:hover { background: var(--active); }
.cmd span { flex: 1; }
.pinned { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.tile { height: 58px; border-radius: 11px; background: var(--hover); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 6px; min-width: 0; transition: background .15s, box-shadow .15s; }
.tile:hover { background: var(--active); }
.tile[aria-current="true"] { background: var(--active); box-shadow: inset 0 0 0 1.5px var(--c); }
.tile b { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 13px/1 var(--font); background: color-mix(in oklab, var(--c) 26%, transparent); color: color-mix(in oklab, var(--c) 72%, var(--fg)); }
.tile span { font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-label { font: 600 10.5px/1 var(--font); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 0; }
.tabs { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; flex: 1; margin: 0 -2px; padding: 0 2px; }
.tab { position: relative; display: flex; align-items: center; border-radius: 10px; transition: background .15s; }
.tab:hover { background: var(--hover); }
.tab[aria-current="true"] { background: var(--active); box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
.tab-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; text-align: left; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.tab-main .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-main .n { font: 500 11.5px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab-pin { width: 28px; height: 28px; margin-right: 4px; border-radius: 7px; display: none; place-items: center; color: var(--muted); }
.tab:hover .tab-pin, .tab-pin:focus-visible { display: grid; }
.tab:hover .n { display: none; }
.tab-pin:hover { background: var(--hover); color: var(--fg); }
.newtab { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--muted); text-align: left; }
.newtab:hover { background: var(--hover); color: var(--side-fg); }
.side-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 0 10px; }
.sync { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok i { background: var(--ok); }
.sync.warn i { background: var(--warn); }
.sync.wait i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--hover); color: var(--fg); }
.panel .iconbtn:hover, .panel .iconbtn[aria-expanded="true"] { background: var(--soft); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }

/* Compact mode (desktop): sidebar hides and floats in from the left edge on hover */
.hot, .scrim { display: none; }
.app.compact { grid-template-columns: minmax(0, 1fr); }
.app.compact .hot { display: block; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; z-index: 29; }
.app.compact .sidebar, .app.mobile .sidebar {
  position: absolute; z-index: 30; top: 8px; bottom: 8px; left: max(8px, env(safe-area-inset-left, 0px)); width: 272px;
  padding: 12px 10px; border-radius: 14px; box-shadow: var(--shadow);
  background: color-mix(in oklab, var(--panel) 86%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transform: translateX(calc(-100% - 24px)); transition: transform .24s cubic-bezier(.3,.7,.2,1);
}
.app.compact .hot:hover + .sidebar, .app.compact .sidebar:hover, .app.compact .sidebar:focus-within, .app.drawer-open .sidebar { transform: none; }
.app.compact .sidebar .cmd, .app.mobile .sidebar .cmd, .app.compact .tile, .app.mobile .tile { background: var(--soft); }
.app.compact .tab:hover, .app.mobile .tab:hover { background: var(--soft); }
.app.compact .tab[aria-current="true"], .app.mobile .tab[aria-current="true"], .app.compact .tile[aria-current="true"], .app.mobile .tile[aria-current="true"] { background: color-mix(in oklab, var(--accent) 16%, var(--panel)); }
.app.mobile { grid-template-columns: minmax(0, 1fr); }
.app.drawer-open .scrim { display: block; position: absolute; inset: 0; z-index: 25; background: var(--scrim); }

/* Panel */
.panel { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 6px; padding: 18px 24px 4px 28px; }
.menu { display: none; margin-left: -8px; }
.app.compact .menu, .app.mobile .menu { display: grid; }
.title { flex: 1; min-width: 0; font: 600 26px/1.2 var(--font); letter-spacing: -.02em; border: 0; background: transparent; padding: 4px 8px; margin-left: -8px; border-radius: 8px; text-overflow: ellipsis; }
.title:hover { background: var(--soft); }
.title:focus { outline: none; background: var(--soft); }
.ph-actions { display: flex; gap: 2px; position: relative; }
.progress { display: flex; align-items: center; gap: 12px; padding: 4px 28px 14px; color: var(--muted); font-size: 12.5px; }
.bar { flex: 1; max-width: 220px; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.progress span { font-variant-numeric: tabular-nums; }
.add { display: flex; align-items: center; gap: 12px; margin: 0 28px 6px; padding: 0 12px; height: 44px; border-radius: 11px; background: var(--soft); border: 1px solid transparent; transition: border-color .15s, background .15s; }
.add:focus-within { border-color: color-mix(in oklab, var(--accent) 55%, transparent); background: var(--panel); }
.add svg { color: var(--accent); }
.add input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; height: 100%; }
.add input::placeholder { color: var(--muted); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 28px 20px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.item { display: flex; align-items: flex-start; gap: 12px; padding: 9px 10px; margin: 0 -10px; border-radius: 9px; }
.item:hover { background: var(--soft); }
.check { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; border: 1.5px solid color-mix(in oklab, var(--muted) 65%, transparent); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.check:hover { border-color: var(--accent); }
.item.done .check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.text { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; padding-top: 1px; }
.item.done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--muted) 55%, transparent); }
.edit { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0; padding-top: 1px; }
.del { flex: none; width: 24px; height: 24px; margin: -2px -4px -2px 0; border-radius: 6px; display: grid; place-items: center; color: var(--muted); opacity: 0; }
.item:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { background: var(--line); color: var(--fg); }
@media (hover: none) { .del { opacity: .55; } }
.empty { padding: 40px 4px; color: var(--muted); max-width: 42ch; }
.empty strong { display: block; color: var(--fg); font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
.pf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 28px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pf .link { color: var(--muted); font-size: 12px; }
.pf .link:hover { color: var(--fg); }
.hint { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.panel.no-list .ph-actions, .panel.no-list .progress, .panel.no-list .add, .panel.no-list .pf, .panel.no-list .title { visibility: hidden; }
.panel.slide-next .scroll, .panel.slide-next .ph { animation: inR .22s ease; }
.panel.slide-prev .scroll, .panel.slide-prev .ph { animation: inL .22s ease; }
@keyframes inR { from { opacity: .3; transform: translateX(18px); } }
@keyframes inL { from { opacity: .3; transform: translateX(-18px); } }

/* Popovers */
.pop { position: absolute; top: 38px; right: 0; z-index: 20; min-width: 200px; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.swatches { display: grid; grid-template-columns: repeat(7, 26px); gap: 6px; padding: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px transparent; }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--c); }
.mi { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; }
.mi:hover { background: var(--soft); }
.mi.danger { color: #d0453d; }
.mi.danger.armed { background: #d0453d; color: var(--on-accent); }

/* Quick switcher */
.switcher { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 16vh 16px 16px; }
.sbox { width: min(560px, 100%); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.sbox .row { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 54px; border-bottom: 1px solid var(--line); color: var(--muted); }
.sbox input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 17px; color: var(--fg); }
.results { max-height: 50vh; overflow-y: auto; padding: 6px; }
.res { display: flex; width: 100%; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; text-align: left; }
.res .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res.sel { background: var(--soft); }
.res .n { font: 500 11.5px/1 var(--mono); color: var(--muted); }

/* Toasts */
.toasts { position: absolute; z-index: 60; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 11px; background: var(--fg); color: var(--panel); box-shadow: var(--shadow); font-size: 13px; animation: up .2s ease; }
.toast button { font-weight: 600; color: color-mix(in oklab, var(--accent) 60%, var(--panel)); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 759px) {
  .ph { padding: 14px 16px 2px 20px; }
  .title { font-size: 22px; }
  .progress { padding: 2px 20px 12px; }
  .add { margin: 0 16px 4px; }
  .scroll { padding: 4px 20px 20px; }
  .pf { padding: 10px 20px 12px; }
  .pf .hint { display: none; }
  input { font-size: 16px; }
  .title { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Server version: own document, iPhone safe areas, Electron title bar */
[hidden] { display: none !important; }
.app { padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.app.mobile .sidebar { top: max(8px, env(safe-area-inset-top, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.foot-actions { display: flex; gap: 2px; }
.titlebar { display: none; }
.is-desktop .titlebar { display: flex; align-items: center; position: absolute; top: 0; left: 0; right: 0; height: 36px; padding-left: 18px; z-index: 5; font: 500 12px/1 var(--font); color: var(--muted); -webkit-app-region: drag; app-region: drag; }
.is-desktop .app { padding-top: 36px; }
.is-desktop .app.compact .sidebar, .is-desktop .app.mobile .sidebar, .is-desktop .app.compact .hot { top: 36px; }
.is-desktop button, .is-desktop input { -webkit-app-region: no-drag; app-region: no-drag; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="titlebar" aria-hidden="true">Drift Lists</div>
  <div class="hot" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar" aria-label="Lists">
    <button class="cmd" id="openSwitcher" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Jump to list</span><kbd id="kbdK">Ctrl K</kbd>
    </button>
    <div class="pinned" id="pinned"></div>
    <div class="side-label">Lists</div>
    <nav class="tabs" id="tabs"></nav>
    <button class="newtab" id="newList" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New list
    </button>
    <div class="side-foot">
      <span class="sync wait" id="sync"><i></i><span>Connecting…</span></span>
      <span class="foot-actions">
      <button class="iconbtn" id="signOut" type="button" title="Sign out" aria-label="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
      </button>
      <button class="iconbtn" id="toggleSide" type="button" title="Hide sidebar (Alt+S)" aria-label="Hide sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      </span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="panel no-list" id="panel">
    <header class="ph">
      <button class="iconbtn menu" id="menuBtn" type="button" aria-label="Show lists">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <input id="title" class="title" aria-label="List name" maxlength="80" autocomplete="off">
      <div class="ph-actions">
        <button class="iconbtn" id="pinBtn" type="button" aria-pressed="false" title="Pin to top">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>
        </button>
        <button class="iconbtn" id="colorBtn" type="button" aria-expanded="false" aria-label="List color">
          <span class="dot" style="--c: var(--accent); width: 12px; height: 12px;"></span>
        </button>
        <button class="iconbtn" id="moreBtn" type="button" aria-expanded="false" aria-label="More">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="pop" id="colorPop" hidden><div class="swatches" id="swatches" role="radiogroup" aria-label="List color"></div></div>
        <div class="pop" id="morePop" hidden>
          <button class="mi" id="clearDoneMenu" type="button">Clear completed tasks</button>
          <button class="mi danger" id="deleteList" type="button">Delete list</button>
        </div>
      </div>
    </header>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
    <form class="add" id="addForm" autocomplete="off">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <input id="addInput" placeholder="Add a task" maxlength="500" enterkeyhint="done">
    </form>
    <div class="scroll" id="scroll">
      <ul class="items" id="items"></ul>
      <div class="empty" id="empty"></div>
    </div>
    <footer class="pf">
      <button class="link" id="clearDone" type="button">Clear completed</button>
      <span class="hint"><kbd>Alt ↑↓</kbd> switch <kbd>Alt N</kbd> new list <kbd>/</kbd> add task</span>
    </footer>
  </main>

  <div class="switcher" id="switcher" hidden>
    <div class="sbox" role="dialog" aria-label="Jump to list">
      <div class="row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="swInput" placeholder="Find a list or type a new name" autocomplete="off">
      </div>
      <div class="results" id="swResults"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script src="app.js"></script>
</body>
</html>
