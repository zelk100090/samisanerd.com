# Paste these two blocks inside your site's server { ... } block
# (usually /etc/nginx/sites-available/default). The app then lives at
# https://example.com/todo/ and the rest of your website is untouched.

# Explicit https: behind Cloudflare, nginx only sees plain http, so a bare
# "/todo/" redirect would send visitors to http:// first.
location = /todo { return 301 https://$host/todo/; }

location /todo/ {
    proxy_pass http://127.0.0.1:8787/;   # trailing slash strips /todo before passing on
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Behind Cloudflare, $remote_addr is a Cloudflare server, not the visitor, so the
    # wrong-password lockout would block everyone sharing that server. Pass the visitor's
    # real address instead. (Only trustworthy if the Pi can't be reached except through
    # Cloudflare, e.g. a Cloudflare Tunnel or a firewall allowing only Cloudflare.)
    # Not using Cloudflare? Use $remote_addr here.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_buffering off;                 # live updates (Server-Sent Events) arrive immediately
    proxy_read_timeout 1h;
    client_max_body_size 2m;
}
