# Paste these two blocks inside your site's existing HTTPS server { ... } block
# (usually /etc/nginx/sites-available/default). The app then lives at
# https://example.com/todo/ and the rest of your website is untouched.

location = /todo { return 301 /todo/; }

location /todo/ {
    proxy_pass http://127.0.0.1:8787/;   # trailing slash strips /todo before passing on
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, so visitors can't fake their IP
    proxy_buffering off;                 # live updates (Server-Sent Events) arrive immediately
    proxy_read_timeout 1h;
    client_max_body_size 2m;
}
